# The name of the workflow as it appears in the GitHub Actions tab
name: Node.js CI

# Defines the events that trigger this workflow
on:
  # Trigger whenever code is pushed to 'main' or 'master' branch
  push:
    branches: [ "main", "master" ]

  # Trigger whenever a Pull Request targeting 'main' or 'master' is opened or updated
  pull_request:
    branches: [ "main", "master" ]

  # Allows you to manually trigger the workflow from the GitHub "Actions" UI tab
  workflow_dispatch:

# Defines the jobs that will run as part of this workflow
jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    # The operating system virtual machine to run the job on
    runs-on: ubuntu-latest

    # Matrix strategy: runs this job multiple times in parallel across different Node versions
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    # The sequence of tasks (steps) to execute in this job
    steps:
      # Step 1: Check out your repository code into the runner VM
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Install and configure the specified Node.js version
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Step 3: Run the automated unit tests
      - name: Run unit tests
        run: npm test

      # Step 4: Verify the application starts without crashing
      - name: Run application entrypoint
        run: npm start
